<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="650" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">CostWarden: AWS architecture</text>
  <text x="20" y="48" font-size="12" fill="#555">Solid = built in the prototype. Dashed = org mode (same code, more registry entries).</text>

  <!-- Frontend -->
  <rect x="20" y="80" width="210" height="330" rx="8" fill="#f4f7fb" stroke="#4a6fa5"/>
  <text x="125" y="102" text-anchor="middle" font-weight="bold" fill="#234">React app (Vite)</text>
  <rect x="38" y="120" width="174" height="56" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="125" y="144" text-anchor="middle">Overview</text>
  <text x="125" y="162" text-anchor="middle" font-size="11" fill="#555">cost avoided per account</text>
  <rect x="38" y="196" width="174" height="56" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="125" y="220" text-anchor="middle">Ask prompt</text>
  <text x="125" y="238" text-anchor="middle" font-size="11" fill="#555">"last cleanup, savings?"</text>
  <rect x="38" y="272" width="174" height="56" rx="6" fill="#fff" stroke="#4a6fa5"/>
  <text x="125" y="296" text-anchor="middle">Runs and approvals</text>
  <text x="125" y="314" text-anchor="middle" font-size="11" fill="#555">approve diff, confirm merge</text>
  <text x="125" y="362" text-anchor="middle" font-size="11" fill="#555">Engineer / FinOps / leadership</text>
  <text x="125" y="382" text-anchor="middle" font-size="11" fill="#555">via FastAPI Lambda (function URL)</text>

  <!-- Agent runtime -->
  <rect x="270" y="80" width="430" height="320" rx="8" fill="#f6f9f4" stroke="#5b8a49"/>
  <text x="485" y="102" text-anchor="middle" font-weight="bold" fill="#243">Agent runtime (local now, Lambda handlers next)</text>
  <rect x="288" y="118" width="150" height="46" rx="6" fill="#fff" stroke="#5b8a49"/>
  <text x="363" y="139" text-anchor="middle">EventBridge schedule</text>
  <text x="363" y="154" text-anchor="middle" font-size="11" fill="#555">or manual run</text>
  <rect x="462" y="118" width="220" height="62" rx="6" fill="#fff" stroke="#5b8a49"/>
  <text x="572" y="140" text-anchor="middle" font-weight="bold">Supervisor "Zeve"</text>
  <text x="572" y="158" text-anchor="middle" font-size="11" fill="#555">LangGraph + SQLite checkpointer</text>
  <text x="572" y="172" text-anchor="middle" font-size="11" fill="#555">fan-out per account</text>

  <rect x="288" y="214" width="92" height="64" rx="6" fill="#fff" stroke="#5b8a49"/>
  <text x="334" y="241" text-anchor="middle">Discovery</text>
  <text x="334" y="258" text-anchor="middle" font-size="11" fill="#555">boto3</text>
  <rect x="392" y="214" width="92" height="64" rx="6" fill="#fff" stroke="#5b8a49"/>
  <text x="438" y="241" text-anchor="middle">Refactoring</text>
  <text x="438" y="258" text-anchor="middle" font-size="11" fill="#555">HCL edits</text>
  <rect x="496" y="214" width="92" height="64" rx="6" fill="#fff" stroke="#5b8a49"/>
  <text x="542" y="241" text-anchor="middle">VCS and PR</text>
  <text x="542" y="258" text-anchor="middle" font-size="11" fill="#555">draft PR</text>
  <rect x="600" y="214" width="92" height="64" rx="6" fill="#fff" stroke="#5b8a49"/>
  <text x="646" y="241" text-anchor="middle">Execution</text>
  <text x="646" y="258" text-anchor="middle" font-size="11" fill="#555">plan only</text>

  <rect x="288" y="314" width="404" height="62" rx="6" fill="#fff8e8" stroke="#c28a1a"/>
  <text x="490" y="338" text-anchor="middle" font-weight="bold">Human approval gates (LangGraph interrupts)</text>
  <text x="490" y="357" text-anchor="middle" font-size="11" fill="#555">1. approve diff before PR   2. confirm merge before plan</text>

  <!-- External services -->
  <rect x="740" y="80" width="200" height="72" rx="6" fill="#fff" stroke="#777"/>
  <text x="840" y="106" text-anchor="middle" font-weight="bold">LLM via get_llm()</text>
  <text x="840" y="124" text-anchor="middle" font-size="11" fill="#555">Ollama (llama3.1) default</text>
  <text x="840" y="139" text-anchor="middle" font-size="11" fill="#555">Nebius Token Factory option</text>
  <rect x="740" y="176" width="200" height="62" rx="6" fill="#fff" stroke="#777"/>
  <text x="840" y="202" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="840" y="220" text-anchor="middle" font-size="11" fill="#555">branch and draft pull request</text>
  <rect x="740" y="262" width="200" height="62" rx="6" fill="#fff" stroke="#777"/>
  <text x="840" y="288" text-anchor="middle" font-weight="bold">Terraform plan</text>
  <text x="840" y="306" text-anchor="middle" font-size="11" fill="#555">local or CI; no direct apply</text>

  <!-- DynamoDB -->
  <rect x="270" y="450" width="210" height="76" rx="8" fill="#eef5fb" stroke="#2a6fb0" stroke-width="2"/>
  <text x="375" y="478" text-anchor="middle" font-weight="bold">DynamoDB</text>
  <text x="375" y="496" text-anchor="middle" font-size="11" fill="#555">costwarden-cleanups</text>
  <text x="375" y="511" text-anchor="middle" font-size="11" fill="#555">account_id + ts_run</text>

  <!-- Target accounts -->
  <rect x="520" y="430" width="420" height="190" rx="8" fill="#fbf6f1" stroke="#b5651d"/>
  <text x="730" y="452" text-anchor="middle" font-weight="bold" fill="#532">Target AWS accounts</text>
  <rect x="538" y="468" width="186" height="64" rx="6" fill="#fff" stroke="#b5651d"/>
  <text x="631" y="494" text-anchor="middle">Account A (prototype)</text>
  <text x="631" y="512" text-anchor="middle" font-size="11" fill="#555">ambient credentials</text>
  <rect x="736" y="468" width="186" height="64" rx="6" fill="#fff" stroke="#b5651d" stroke-dasharray="5,4"/>
  <text x="829" y="494" text-anchor="middle">Accounts B to N (org)</text>
  <text x="829" y="512" text-anchor="middle" font-size="11" fill="#555">assume CostWardenReadOnly</text>
  <text x="730" y="566" text-anchor="middle" font-size="12" fill="#333">EC2 (EBS, EIP, NAT, snapshots) · CloudWatch · Trusted Advisor</text>
  <text x="730" y="584" text-anchor="middle" font-size="11" fill="#555">read-only access; Terraform changes only after approval</text>
  <text x="730" y="604" text-anchor="middle" font-size="11" fill="#555">IAM: costwarden-app policy, costwarden-lambda role</text>

  <!-- Arrows -->
  <line x1="230" y1="224" x2="268" y2="224" stroke="#444" marker-end="url(#arrow)"/>
  <text x="249" y="214" text-anchor="middle" font-size="10" fill="#555">API</text>
  <line x1="220" y1="410" x2="290" y2="450" stroke="#444" marker-end="url(#arrow)"/>
  <text x="195" y="436" text-anchor="middle" font-size="10" fill="#555">read history</text>
  <line x1="438" y1="141" x2="460" y2="141" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="572" y1="180" x2="572" y2="212" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="490" y1="278" x2="490" y2="312" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="700" y1="116" x2="738" y2="116" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="700" y1="207" x2="738" y2="207" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="700" y1="293" x2="738" y2="293" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="400" y1="400" x2="380" y2="448" stroke="#444" marker-end="url(#arrow)"/>
  <text x="440" y="428" text-anchor="middle" font-size="10" fill="#555">record cleanups</text>
  <line x1="600" y1="400" x2="620" y2="466" stroke="#444" marker-end="url(#arrow)"/>
  <line x1="660" y1="400" x2="800" y2="466" stroke="#444" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="660" y="428" text-anchor="middle" font-size="10" fill="#555">boto3, read-only</text>
</svg>
